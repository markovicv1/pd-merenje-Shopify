name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_ref:
        description: 'Grana za test verziju (/test/)'
        required: false
        default: 'claude/happy-mendel-t00n04'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # Test verzija na /pd-merenje-Shopify/test/ — ne utiče na produkciju; ako grana ne postoji, preskače se
      - name: Checkout test grane
        id: test_checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.test_ref || 'claude/happy-mendel-t00n04' }}
          path: test-src

      - name: Build test verzije
        if: steps.test_checkout.outcome == 'success'
        continue-on-error: true
        working-directory: test-src
        env:
          VITE_BASE: /pd-merenje-Shopify/test/
        run: |
          npm install
          npx vite build --outDir ../dist/test --emptyOutDir
          sed -i 's#<head>#<head><meta name="robots" content="noindex">#' ../dist/test/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
