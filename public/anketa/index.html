<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Anketa: oblik lica</title>
<style>
  :root { --bg:#171f2e; --panel:#1f293d; --line:#404d66; --txt:#e6e9ef; --dim:#8c95a8; --acc:#00b8ff; --sel:#0a3a52; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--txt); font: 16px/1.45 Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 16px 16px 40px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  h2 { font-size: 17px; margin: 18px 0 8px; }
  p { margin: 8px 0; }
  .dim { color: var(--dim); font-size: 14px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn { display: block; width: 100%; padding: 14px; border-radius: 12px; border: 0; background: var(--acc); color: #001018; font-weight: 700; font-size: 16px; }
  .btn[disabled] { opacity: .35; cursor: default; }
  .btn2 { background: transparent; color: var(--txt); border: 1px solid var(--line); font-weight: 600; }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  .row > * { flex: 1; }
  input[type=text] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--txt); font: inherit; }
  .legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .legend div { display: flex; gap: 8px; align-items: center; background: var(--panel); border-radius: 10px; padding: 8px; font-size: 13px; }
  .legend svg { flex: 0 0 34px; }
  .photo { width: 100%; aspect-ratio: 3 / 4; background: #0b0f17; border-radius: 14px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .photo img { width: 100%; height: 100%; object-fit: contain; }
  .bar { height: 6px; background: var(--panel); border-radius: 3px; overflow: hidden; margin: 6px 0 12px; }
  .bar i { display: block; height: 100%; background: var(--acc); }
  .shapes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .shape { background: var(--panel); border: 2px solid transparent; border-radius: 12px; padding: 6px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; position: relative; }
  .shape.on { border-color: var(--acc); background: var(--sel); }
  .shape .pct { position: absolute; top: 2px; right: 4px; font-size: 10px; background: var(--sel); border-radius: 4px; padding: 0 2px; font-weight: 700; color: var(--acc); }
  .shape.skip { font-size: 12px; justify-content: center; color: var(--dim); }
  .shape.skip.on { color: var(--txt); }
  .split { display: flex; gap: 6px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  .split button { flex: 1; min-width: 64px; padding: 10px 4px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; }
  .split button.on { border-color: var(--acc); background: var(--sel); }
  .hint { min-height: 22px; margin-top: 8px; font-size: 14px; color: var(--dim); text-align: center; }
  textarea { width: 100%; min-height: 120px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: #0b0f17; color: var(--txt); font: 13px/1.4 ui-monospace, monospace; }
  .note { background: #2a2410; border: 1px solid #6b5a1a; color: #ffe08a; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
</style>
</head>
<body>
<main id="app"></main>
<script>
(() => {
  // ── Oblici lica (isti ključevi i obrisi kao u aplikaciji — src/lib/faceShape.js) ──
  const SHAPES = [
    ['oval', 'Ovalno', 'duže nego šire, blago zaobljeno, čelo malo šire od brade'],
    ['round', 'Okruglo', 'širina ≈ visina, meke linije, puni obrazi'],
    ['oblong', 'Duguljasto', 'znatno duže nego šire, ravne strane'],
    ['square', 'Četvrtasto', 'široka, uglasta vilica, čelo ≈ vilica'],
    ['heart', 'Srcoliko', 'široko čelo, uska i špicasta brada'],
    ['triangle', 'Trouglasto', 'usko čelo, široka vilica'],
    ['diamond', 'Dijamantsko', 'najšire u jagodicama, usko čelo i brada'],
  ];
  const NAME = Object.fromEntries(SHAPES.map(s => [s[0], s[1]]));
  // Polu-širine na visinama Y (viewBox 100×130), vrh čela i brada
  const Y = [18, 30, 50, 70, 90, 105, 116];
  const PROFILE = {
    oval:     { top: 8,  chin: 124, w: [20, 30, 36, 37, 32, 22, 11] },
    round:    { top: 12, chin: 120, w: [26, 36, 41, 42, 39, 30, 16] },
    oblong:   { top: 4,  chin: 128, w: [22, 29, 31, 31, 30, 25, 14] },
    square:   { top: 10, chin: 122, w: [30, 36, 38, 38, 38, 34, 22] },
    heart:    { top: 8,  chin: 124, w: [30, 38, 40, 37, 29, 18, 6] },
    triangle: { top: 10, chin: 122, w: [16, 24, 31, 36, 40, 36, 22] },
    diamond:  { top: 8,  chin: 124, w: [12, 22, 34, 40, 30, 18, 7] },
  };
  // Zatvorena Catmull-Rom kriva kroz tačke obrisa
  function outlinePath(key, jitter = null) {
    const p = PROFILE[key];
    const w = p.w.map((v, i) => v * (jitter ? jitter[i] : 1));
    const pts = [[50, p.top], ...Y.map((y, i) => [50 + w[i], y]), [50, p.chin], ...Y.map((y, i) => [50 - w[i], y]).reverse()];
    const n = pts.length; let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += `C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d + 'Z';
  }
  const icon = (key, size = 34) =>
    `<svg width="${size}" height="${size * 1.3}" viewBox="0 0 100 130" aria-hidden="true"><path d="${outlinePath(key)}" fill="none" stroke="currentColor" stroke-width="6"/></svg>`;

  // ── Podaci ──
  const params = new URLSearchParams(location.search);
  const demo = params.has('demo');
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* bez pamćenja */ } },
    del(k) { try { localStorage.removeItem(k); } catch { /* ništa */ } },
  };
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  // Demo: šematska lica iz obrisa (samo za probu toka ankete)
  function demoPhotos() {
    const keys = ['heart', 'oval', 'square', 'oblong', 'round', 'diamond'];
    return keys.map((k, i) => {
      const jit = Y.map(() => 0.94 + Math.random() * 0.12);
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -5 120 140"><rect x="-10" y="-5" width="120" height="140" fill="#e9dccb"/>
        <path d="${outlinePath(k, jit)}" fill="#f2c9a5" stroke="#8a5a3c" stroke-width="1.2"/>
        <ellipse cx="38" cy="58" rx="6" ry="3.5" fill="#fff"/><circle cx="38" cy="58" r="2.4" fill="#3b2a20"/>
        <ellipse cx="62" cy="58" rx="6" ry="3.5" fill="#fff"/><circle cx="62" cy="58" r="2.4" fill="#3b2a20"/>
        <path d="M50 62 L47 80 L53 80" fill="none" stroke="#8a5a3c" stroke-width="1"/>
        <path d="M42 94 Q50 99 58 94" fill="none" stroke="#a0524a" stroke-width="1.6"/></svg>`;
      return { id: `demo${i + 1}`, src: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg) };
    });
  }

  let set = 'A', photos = [], key = '', st = null;
  const app = document.getElementById('app');

  async function init() {
    if (demo) { set = 'DEMO'; photos = demoPhotos(); }
    else {
      try {
        const m = await (await fetch('foto/manifest.json', { cache: 'no-store' })).json();
        set = m.set || 'A';
        photos = (m.photos || []).map(p => ({ id: p.id, src: 'foto/' + p.src }));
      } catch { photos = []; }
    }
    key = 'oblik-anketa-' + set;
    st = store.get(key);
    const ids = photos.map(p => p.id);
    if (!st || !Array.isArray(st.order) || st.order.some(id => !ids.includes(id)) || st.order.length !== ids.length) {
      st = { rater: st?.rater || '', order: shuffle(ids), idx: -1, ans: {} };
    }
    render();
  }
  const save = () => store.set(key, st);
  const photoById = (id) => photos.find(p => p.id === id);

  // ── Ekrani ──
  function render() {
    if (!photos.length) return renderEmpty();
    if (st.idx < 0) return renderIntro();
    if (st.idx >= st.order.length) return renderEnd();
    renderPhoto();
  }

  function renderEmpty() {
    app.innerHTML = `<h1>Anketa: oblik lica</h1>
      <p class="note">Fotografije za anketu još nisu dodate.</p>
      <p class="dim">Tok ankete možete probati na šematskim licima:</p>
      <a class="btn" style="text-align:center;text-decoration:none" href="?demo=1">Probna anketa</a>`;
  }

  function renderIntro() {
    app.innerHTML = `
      ${demo ? '<p class="note">PROBNA ANKETA — šematska lica, samo za probu toka.</p>' : ''}
      <h1>Anketa: oblik lica</h1>
      <p>Pomažete nam da naučimo aplikaciju da prepozna oblik lica. Videćete ${photos.length} fotografija;
         za svaku izaberite oblik koji vam se čini najbližim.</p>
      <p class="dim">Ako vam lice deluje kao spoj dva oblika, izaberite oba i odredite odnos (npr. 50/50).
         Ako ne možete da procenite, i to je odgovor. Nema tačnih i pogrešnih odgovora — zanima nas vaš utisak.
         Anketa traje oko ${Math.max(2, Math.round(photos.length * 12 / 60))} minuta; napredak se čuva na ovom uređaju.</p>
      <h2>Oblici</h2>
      <div class="legend">${SHAPES.map(([k, n, d]) => `<div>${icon(k)}<span><b>${n}</b><br><span class="dim">${d}</span></span></div>`).join('')}</div>
      <h2>Vaše ime ili nadimak</h2>
      <input id="rater" type="text" maxlength="40" placeholder="npr. Ana" value="${esc(st.rater)}" autocomplete="off">
      <p class="dim">Samo da bismo razlikovali odgovore različitih ocenjivača.</p>
      <div class="row"><button class="btn" id="go">Počni</button></div>`;
    const inp = document.getElementById('rater'), go = document.getElementById('go');
    const upd = () => { go.disabled = !inp.value.trim(); };
    inp.oninput = upd; upd();
    go.onclick = () => { st.rater = inp.value.trim(); st.idx = 0; save(); render(); };
  }

  function renderPhoto() {
    const id = st.order[st.idx], p = photoById(id);
    const a = st.ans[id] || { sel: [], split: 50, skip: false };
    const n = st.order.length;
    const pctOf = (k) => {
      if (!a.sel.includes(k)) return '';
      if (a.sel.length === 1) return '';
      return (a.sel[0] === k ? a.split : 100 - a.split) + '%';
    };
    const answered = a.skip || a.sel.length > 0;
    app.innerHTML = `
      <div class="dim">${demo ? 'PROBNA · ' : ''}Fotografija ${st.idx + 1} od ${n}</div>
      <div class="bar"><i style="width:${(st.idx / n) * 100}%"></i></div>
      <div class="photo"><img alt="Fotografija ${st.idx + 1}" src="${p.src}"></div>
      <div class="shapes">
        ${SHAPES.map(([k, nm]) => `<button class="shape${a.sel.includes(k) ? ' on' : ''}" data-k="${k}" aria-pressed="${a.sel.includes(k)}">
          <span class="pct">${pctOf(k)}</span>${icon(k, 30)}<span>${nm}</span></button>`).join('')}
        <button class="shape skip${a.skip ? ' on' : ''}" data-skip="1" aria-pressed="${a.skip}">Ne mogu da procenim</button>
      </div>
      ${a.sel.length === 2 ? `
        <div class="split" role="group" aria-label="Odnos">
          ${[50, 60, 70].map(v => `<button data-split="${v}" class="${a.split === v ? 'on' : ''}">${v}/${100 - v}</button>`).join('')}
          ${a.split !== 50 ? '<button data-swap="1" title="Zameni koji oblik preovlađuje">⇄</button>' : ''}
        </div>
        <div class="hint">${NAME[a.sel[0]]} ${a.split}% · ${NAME[a.sel[1]]} ${100 - a.split}%</div>`
      : `<div class="hint">${a.sel.length === 1 ? 'Ako vam liči i na drugi oblik, izaberite i njega.' : 'Izaberite jedan ili dva oblika.'}</div>`}
      <div class="row">
        <button class="btn btn2" id="back">Nazad</button>
        <button class="btn" id="next" ${answered ? '' : 'disabled'}>${st.idx + 1 === n ? 'Završi' : 'Dalje'}</button>
      </div>`;
    const commit = () => { st.ans[id] = a; save(); renderPhoto(); };
    app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
      const k = b.dataset.k; a.skip = false;
      if (a.sel.includes(k)) { a.sel = a.sel.filter(x => x !== k); a.split = 50; }
      else if (a.sel.length < 2) a.sel.push(k);
      else { a.sel = [a.sel[0], k]; }
      commit();
    });
    app.querySelector('[data-skip]').onclick = () => { a.skip = !a.skip; if (a.skip) { a.sel = []; a.split = 50; } commit(); };
    app.querySelectorAll('[data-split]').forEach(b => b.onclick = () => { a.split = Number(b.dataset.split); commit(); });
    const sw = app.querySelector('[data-swap]');
    if (sw) sw.onclick = () => { a.sel = [a.sel[1], a.sel[0]]; commit(); };
    document.getElementById('back').onclick = () => { st.idx -= 1; save(); render(); };
    document.getElementById('next').onclick = () => { st.idx += 1; save(); render(); window.scrollTo(0, 0); };
  }

  // Kod: OBLIK1;set;ime;id=oblik.procenat+oblik.procenat;id=?;...
  function resultCode() {
    const parts = st.order.map(id => {
      const a = st.ans[id];
      if (!a || a.skip || !a.sel.length) return `${id}=?`;
      if (a.sel.length === 1) return `${id}=${a.sel[0]}`;
      return `${id}=${a.sel[0]}.${a.split}+${a.sel[1]}.${100 - a.split}`;
    });
    const rater = st.rater.replace(/[;=]/g, ' ');
    return ['OBLIK1', set, rater, ...parts].join(';');
  }

  function renderEnd() {
    const code = resultCode();
    const done = st.order.filter(id => st.ans[id] && (st.ans[id].skip || st.ans[id].sel.length)).length;
    app.innerHTML = `
      <h1>Hvala!</h1>
      <p>Ocenili ste ${done} od ${st.order.length} fotografija. Pošaljite nam odgovore — dugme „Podeli" otvara
         poruke, mejl ili WhatsApp; možete i da kopirate kod i nalepite ga u poruku.</p>
      ${demo ? '<p class="note">Ovo je probna anketa — kod ne treba slati.</p>' : ''}
      <textarea id="code" readonly>${esc(code)}</textarea>
      <div class="row">
        ${navigator.share ? '<button class="btn" id="share">Podeli</button>' : ''}
        <button class="btn ${navigator.share ? 'btn2' : ''}" id="copy">Kopiraj</button>
      </div>
      <div class="row"><a class="btn btn2" style="text-align:center;text-decoration:none" href="mailto:?subject=${encodeURIComponent('Anketa: oblik lica (' + st.rater + ')')}&body=${encodeURIComponent(code)}">Pošalji mejlom</a></div>
      <div class="hint" id="msg"></div>
      <div class="row"><button class="btn btn2" id="back">Nazad na fotografije</button></div>
      <div class="row"><button class="btn btn2" id="restart">Počni ispočetka</button></div>`;
    const msg = document.getElementById('msg');
    const share = document.getElementById('share');
    if (share) share.onclick = async () => { try { await navigator.share({ title: 'Anketa: oblik lica', text: code }); } catch { /* otkazano */ } };
    document.getElementById('copy').onclick = async () => {
      try { await navigator.clipboard.writeText(code); msg.textContent = 'Kod je kopiran.'; }
      catch { const t = document.getElementById('code'); t.select(); msg.textContent = 'Označite i kopirajte kod ručno.'; }
    };
    document.getElementById('back').onclick = () => { st.idx = st.order.length - 1; save(); render(); };
    document.getElementById('restart').onclick = () => {
      if (!confirm('Obrisati sve odgovore i početi ispočetka?')) return;
      store.del(key); st = { rater: st.rater, order: shuffle(photos.map(p => p.id)), idx: -1, ans: {} }; save(); render();
    };
  }

  init();
})();
</script>
</body>
</html>
